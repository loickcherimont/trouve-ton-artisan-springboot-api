services:
  postgres:
    image: 'postgres:18'
    environment:
      - 'POSTGRES_DB=trouve_ton_artisan'
      - 'POSTGRES_USER=test'
      - 'POSTGRES_PASSWORD=test'
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test -d trouve_ton_artisan']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: