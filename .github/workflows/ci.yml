name: Java CI with Maven and Docker

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# The workflow is green only when every job succeeds:
# unit + integration tests (with a coverage gate) and the Postman API tests.
jobs:
  # Job 1 - Unit tests (Surefire, *Test), integration tests (Failsafe, *IT with
  # Testcontainers) plus code coverage (JaCoCo report and 88% line check).
  build:
    name: Build, test & coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make wrapper executable
        run: chmod +x mvnw

      # Compile, run unit + integration tests, package the jar and check
      # coverage with JaCoCo.
      - name: Build, test and verify coverage with Maven
        run: ./mvnw -B clean verify

      # Keep Surefire, Failsafe and JaCoCo reports as downloadable artifacts.
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
          if-no-files-found: ignore

  # Job 2 - API contract tests: start PostgreSQL, run the application and replay
  # the Postman collection with the Postman CLI. A failing assertion makes
  # `postman collection run` exit non-zero, which fails this job.
  api-tests:
    name: Postman API tests (Postman CLI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Make wrapper executable
        run: chmod +x mvnw

      - name: Start PostgreSQL
        run: docker compose up -d --wait

      - name: Build application jar
        run: ./mvnw -B -DskipTests package

      - name: Start application
        # The dev profile points at the docker-compose database and seeds the
        # four categories required by the Postman assertions.
        run: |
          java -jar target/trouve_ton_artisan-0.0.1-SNAPSHOT.jar \
            --spring.profiles.active=dev \
            --spring.docker.compose.enabled=false > app.log 2>&1 &

      - name: Wait for the API to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/categories > /dev/null; then
              echo "API is ready"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become ready in time"
          cat app.log
          exit 1

      - name: Install Postman CLI
        run: npm install -g postman-cli

      - name: Run Postman collection
        # Local collection file: no API key required.
        run: |
          mkdir -p postman
          postman collection run Trouve_Ton_Artisan_API.postman_collection.json \
            --reporters cli,junit --reporter-junit-export postman/postman-report.xml

      - name: Upload Postman report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-report
          path: postman/

      - name: Show application logs on failure
        if: failure()
        run: cat app.log

      - name: Stop PostgreSQL
        if: always()
        run: docker compose down -v
